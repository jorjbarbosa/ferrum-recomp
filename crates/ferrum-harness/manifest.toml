# Cases that fail on purpose, each with the reason. A case listed here that passes fails the
# acceptance test, so the list cannot go stale.
# Each one is written `<directory>/<stem>:<symbol>`.

# Jump tables whose bound check the analysis cannot see, with the count of entries, as
# `[analysis] jump_tables` gives it for a game. `bctr` is the offset of the bctr in the .bin.

[[jump_table]]
file = "xenia-ppc/seq_jumptable_constants"
bctr = 0x1C
entries = 4
reason = """The bound check compares r3 into cr6 (cmpwi cr6, r3, 3) and the bgt that follows tests cr0, so it bounds nothing. The table after the bctr has four entries, .case_0 to .case_3."""

[[exclusion]]
case = "xenia-canary-ppc/instr_lxarx:test_ldarx_offset"
reason = """ldarx at an address that is not a multiple of 8. Book II leaves that to the alignment interrupt or to boundedly undefined results; the runtime takes the interrupt and panics, while Canary performs the load."""

[[exclusion]]
case = "xenia-ppc/instr_vmaddfp:test_vmaddfp_1"
reason = """Word 2 expects 0x4013D70A, which is 1.1 x 1.1 + 1.1 with the product rounded to single before the addition. vmaddfp adds vB to the infinitely precise product and rounds once (Book I of the Power ISA v3.1C, chapter 6, bfp32_MULTIPLY_ADD), which gives 0x4013D70B."""
