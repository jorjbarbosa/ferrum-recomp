name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with `rust-version` in the workspace Cargo.toml.
  RUST_TOOLCHAIN: "1.99.1"

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update
          rustup default "$RUST_TOOLCHAIN"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      # The trace feature changes every memory accessor, so it gets its own clippy and test run.
      - name: Run clippy on the runtime with trace
        run: cargo clippy -p ferrum-runtime --all-targets --features trace --locked -- -D warnings

      - name: Run runtime tests with trace
        run: cargo test -p ferrum-runtime --features trace --locked

      # The harness's trace feature checks every guest access against its regions, reads included.
      - name: Run clippy on the harness with trace
        run: cargo clippy -p ferrum-harness --all-targets --features trace --locked -- -D warnings
      - name: Run the harness with trace
        run: cargo test -p ferrum-harness --features trace --locked
